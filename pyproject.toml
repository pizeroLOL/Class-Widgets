[project]
name = "class_widgets"
version = "0.1.0"
description = " Class Widgets 是一款能够显示当前课程的桌面组件应用程序。其提供了易用课程表编辑和美观的桌面组件。 "
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "annotated-types==0.7.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "colorama==0.4.6",
    "configparser~=7.1.0",
    "darkdetect==0.8.0",
    "edge-tts~=7.0.0",
    "idna==3.10",
    "loguru~=0.7.2",
    "markdown~=3.7",
    "ntplib~=0.4.0",
    "packaging~=24.2",
    "psutil==5.9.5",
    "pycses",
    "pydantic==2.10.6",
    "pydantic-core==2.27.2",
    "pygame~=2.6.1",
    "pygetwindow~=0.0.9",
    "pyqt-fluent-widgets~=1.8.1",
    "pyqt5~=5.15.11",
    "pyqt5-frameless-window==0.4.3",
    "pyqt5-qt5~=5.15.2",
    "pyqt5-sip==12.15.0",
    "pyqt5-stubs==5.15.6.0",
    "pyqtwebengine~=5.15.7",
    "python-dateutil==2.8.2",
    "pyttsx3==2.98",
    "pytz~=2025.2",
    "pywin32==306 ; sys_platform == 'win32'",
    "requests==2.32.4",
    "typing-extensions==4.13.2",
    "urllib3==2.2.3",
    "win32-setctime==1.1.0",
]

[projects.gui-scripts]
main = "class_widgets.main:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/io_nfc_backend"]

[tool.uv.sources]
pycses = { git = "https://github.com/SmartTeachCN/pycses.git" }

[tool.uv.workspace]
members = ["tmp"]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pyright>=1.1.402",
    "ruff>=0.12.8",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",    # line too long
    "E203",    # whitespace before ':'
    "F841",    # local variable assigned but never used
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
    "ARG002",  # unused method argument
    "PTH123",  # pathlib instead of os.path.join
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/migrations/*" = ["E501"]

[tool.pyright]
"include" = ["**/*.py"]
"exclude" = [
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "**/venv",
    "build",
    "dist",
]
"reportMissingImports" = "error"
"reportMissingTypeStubs" = "warning"
"reportImportCycles" = "error"
"reportUnusedImport" = "warning"
"reportUnusedClass" = "warning"
"reportUnusedFunction" = "warning"
"reportUnusedVariable" = "warning"
"reportDuplicateImport" = "error"
"reportOptionalSubscript" = "warning"
"reportOptionalMemberAccess" = "warning"
"reportOptionalCall" = "warning"
"reportOptionalIterable" = "warning"
"reportOptionalContextManager" = "warning"
"reportOptionalOperand" = "warning"
"reportGeneralTypeIssues" = "error"
"reportUntypedFunctionDecorator" = "warning"
"reportUntypedClassDecorator" = "warning"
"reportUntypedBaseClass" = "warning"
"reportUntypedNamedTuple" = "warning"
"reportPrivateUsage" = "warning"
"reportConstantRedefinition" = "error"
"reportIncompatibleMethodOverride" = "error"
"reportIncompatibleVariableOverride" = "error"
"reportOverlappingOverload" = "error"
"reportMissingParameterType" = "warning"
"reportMissingReturnType" = "warning"
"reportUnnecessaryIsInstance" = "warning"
"reportUnnecessaryCast" = "warning"
"reportAssertAlwaysTrue" = "warning"
"reportSelfClsParameterName" = "warning"
"reportImplicitStringConcatenation" = "warning"
"pythonVersion" = "${{ env.PYTHON_VERSION }}"
"pythonPlatform" = "All"
"typeCheckingMode" = "strict"
"useLibraryCodeForTypes" = true
"autoImportCompletions" = true
"strictListInference" = false
"strictDictionaryInference" = false
"strictSetInference" = false

[[tool.pyright.executionEnvironments]]
"root" = "."
"pythonVersion" = "3.8"
"pythonPlatform" = "All"
"extraPaths" = [".", "./config", "./ui", "./view"]
